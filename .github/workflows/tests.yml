name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"  # weekly, to catch changes in the live API

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -v --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: junit.xml
